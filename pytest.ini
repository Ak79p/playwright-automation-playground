[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts =
    --base-url http://www.uitestingplayground.com
    --browser chromium
    --screenshot only-on-failure
    --output test-results
    -ra
    --import-mode=importlib
markers =
    smoke: fast sanity checks that verify the environment and target app are reachable
